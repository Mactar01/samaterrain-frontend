<div class="min-h-screen bg-slate-50 flex flex-col">
  <!-- Navbar simplifiée -->
  <div class="bg-slate-900 shadow-sm border-b border-slate-800 px-4 py-3 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="bg-green-500 text-white p-1.5 rounded-lg shadow-sm">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </div>
      <span class="text-xl font-bold text-white tracking-tight">Mon Profil</span>
    </div>
    <div class="flex items-center gap-4">
      <a routerLink="/dashboard" class="text-slate-300 hover:text-white text-sm font-medium transition-colors">Retour au tableau de bord</a>
    </div>
  </div>

  <main class="flex-1 overflow-y-auto p-4 sm:p-8 max-w-4xl mx-auto w-full">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <!-- Header avec avatar -->
      <div class="bg-green-50 px-8 py-10 border-b border-green-100 flex flex-col items-center">
        <div class="h-24 w-24 rounded-full bg-green-500 flex items-center justify-center text-4xl font-bold text-white shadow-lg mb-4">
          {{ user?.name ? user.name.charAt(0).toUpperCase() : 'U' }}
        </div>
        <h2 class="text-2xl font-bold text-slate-900">{{ user?.name }}</h2>
        <p class="text-green-700 font-medium mt-1">{{ user?.email }}</p>
      </div>

      <div class="p-8">
        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-8">
          
          <!-- Section Infos -->
          <div>
            <h3 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-2 mb-6">Informations personnelles</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nom complet</label>
                <input type="text" formControlName="name" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors shadow-sm">
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Téléphone</label>
                <input type="text" formControlName="phone" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors shadow-sm">
              </div>
            </div>
          </div>

          <!-- Section Sécurité -->
          <div>
            <h3 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-2 mb-6">Sécurité et Mot de passe</h3>
            <p class="text-sm text-slate-500 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-100">
              <span class="font-semibold text-slate-700">Note :</span> Laissez ces champs vides si vous ne souhaitez pas modifier votre mot de passe actuel.
            </p>
            
            <div class="space-y-6">
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Mot de passe actuel</label>
                <input type="password" formControlName="current_password" class="w-full md:w-1/2 px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors shadow-sm">
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Nouveau mot de passe</label>
                  <input type="password" formControlName="new_password" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors shadow-sm">
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Confirmer le nouveau mot de passe</label>
                  <input type="password" formControlName="new_password_confirmation" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors shadow-sm">
                </div>
              </div>
            </div>
          </div>

          <!-- Bouton Submit -->
          <div class="pt-6 flex justify-end">
            <button type="submit" [disabled]="profileForm.invalid || isLoading" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg shadow-sm transition-all flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
              <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Enregistrer les modifications
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

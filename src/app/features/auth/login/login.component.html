<div class="min-h-screen flex">
  <!-- Left Side: Form -->
  <div class="flex-1 flex flex-col justify-center py-12 px-4 sm:px-6 lg:flex-none lg:px-20 xl:px-24 bg-white">
    <div class="mx-auto w-full max-w-sm lg:w-96">
      <div>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-green-600 rounded-lg flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-gray-900">myTerrain</h2>
        </div>
        <h2 class="mt-8 text-3xl font-extrabold text-gray-900">Espace Partenaire</h2>
        <p class="mt-2 text-sm text-gray-600">
          Gérez vos infrastructures sportives et développez vos revenus.
        </p>
      </div>

      <div class="mt-8">
        <div *ngIf="error" class="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded-r-md">
          <div class="flex">
            <div class="flex-shrink-0">
              <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
              </svg>
            </div>
            <div class="ml-3">
              <p class="text-sm text-red-700">{{ error }}</p>
            </div>
          </div>
        </div>

        <form class="space-y-6" (ngSubmit)="onSubmit()">
          <div>
            <label for="email" class="block text-sm font-semibold text-gray-700"> Email professionnel </label>
            <div class="mt-2">
              <input id="email" name="email" type="email" autocomplete="email" required [(ngModel)]="credentials.email"
                class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 sm:text-sm transition-colors">
            </div>
          </div>

          <div>
            <label for="password" class="block text-sm font-semibold text-gray-700"> Mot de passe </label>
            <div class="mt-2">
              <input id="password" name="password" type="password" autocomplete="current-password" required [(ngModel)]="credentials.password"
                class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 sm:text-sm transition-colors">
            </div>
          </div>

          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300 rounded">
              <label for="remember-me" class="ml-2 block text-sm text-gray-900"> Se souvenir de moi </label>
            </div>
            <div class="text-sm">
              <a href="#" class="font-medium text-green-600 hover:text-green-500"> Mot de passe oublié ? </a>
            </div>
          </div>

          <div>
            <button type="submit" [disabled]="isLoading"
              class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all transform active:scale-[0.98]">
              <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              {{ isLoading ? 'Connexion en cours...' : 'Se connecter' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <!-- Right Side: Image -->
  <div class="hidden lg:block relative w-0 flex-1">
    <div class="absolute inset-0 bg-green-900">
      <img class="absolute inset-0 h-full w-full object-cover mix-blend-overlay opacity-60" 
           src="https://images.unsplash.com/photo-1529900965600-09ce14b08759?q=80&w=2070&auto=format&fit=crop" 
           alt="Football field">
    </div>
    <div class="absolute inset-0 flex items-center justify-center p-12">
      <div class="max-w-xl text-center text-white">
        <h2 class="text-4xl font-bold tracking-tight mb-4">La plateforme n°1 de gestion de terrains</h2>
        <p class="text-lg text-green-100">
          Digitalisez vos réservations, augmentez votre taux de remplissage et simplifiez votre comptabilité avec notre outil tout-en-un.
        </p>
      </div>
    </div>
  </div>
</div>

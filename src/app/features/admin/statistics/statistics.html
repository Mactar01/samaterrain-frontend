<div class="max-w-7xl mx-auto py-8">
  <div class="mb-8">
    <h1 class="text-3xl font-extrabold text-black tracking-tight">Statistiques</h1>
    <p class="mt-2 text-sm text-neutral-600">Analyses détaillées de l'utilisation de la plateforme.</p>
  </div>

  <div *ngIf="loading" class="flex justify-center py-20">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-black"></div>
  </div>

  <div *ngIf="!loading && error" class="bg-red-50 p-4 rounded-md border border-red-200 text-red-700">
    Une erreur est survenue lors du chargement des statistiques.
  </div>

  <div *ngIf="!loading && !error" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    
    <!-- Evolution des revenus -->
    <div class="bg-white border border-neutral-200 rounded-lg shadow-sm p-6">
      <h3 class="text-lg font-bold text-black mb-4">Évolution des revenus (6 derniers mois)</h3>
      <div class="relative h-80">
        <canvas baseChart
          [data]="lineChartData"
          [options]="lineChartOptions"
          [type]="lineChartType">
        </canvas>
      </div>
    </div>

    <!-- Répartition des réservations -->
    <div class="bg-white border border-neutral-200 rounded-lg shadow-sm p-6">
      <h3 class="text-lg font-bold text-black mb-4">Statut des réservations</h3>
      <div class="relative h-80">
        <canvas baseChart
          [data]="pieChartData"
          [options]="pieChartOptions"
          [type]="pieChartType">
        </canvas>
      </div>
    </div>

  </div>
</div>

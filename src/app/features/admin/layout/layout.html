<div class="min-h-screen bg-neutral-100 font-sans text-neutral-900 flex">
  
  <!-- Sidebar -->
  <aside class="w-64 bg-black text-white flex-shrink-0 flex flex-col hidden md:flex">
    <div class="h-16 flex items-center px-6 border-b border-neutral-800">
      <svg class="w-8 h-8 mr-2 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
      </svg>
      <span class="font-bold text-xl tracking-wider uppercase">Admin</span>
    </div>
    
    <div class="flex-1 py-6 px-4 space-y-2 overflow-y-auto">
      <div class="text-xs font-semibold text-neutral-500 uppercase tracking-wider mb-2 px-2">Menu Principal</div>
      
      <a routerLink="/admin/dashboard" routerLinkActive="bg-neutral-800 text-white" class="flex items-center px-2 py-3 text-neutral-300 hover:bg-neutral-800 hover:text-white rounded-md transition-colors">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        Tableau de bord
      </a>
      
      <a routerLink="/admin/statistics" routerLinkActive="bg-neutral-800 text-white" class="flex items-center px-2 py-3 text-neutral-300 hover:bg-neutral-800 hover:text-white rounded-md transition-colors">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
        Statistiques
      </a>
      
      <a routerLink="/admin/billing" routerLinkActive="bg-neutral-800 text-white" class="flex items-center px-2 py-3 text-neutral-300 hover:bg-neutral-800 hover:text-white rounded-md transition-colors">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        Facturation & Gains
      </a>
      
      <a routerLink="/admin/settings" routerLinkActive="bg-neutral-800 text-white" class="flex items-center px-2 py-3 text-neutral-300 hover:bg-neutral-800 hover:text-white rounded-md transition-colors">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        Paramètres
      </a>
    </div>

    <div class="p-4 border-t border-neutral-800">
      <button (click)="logout()" class="w-full flex items-center justify-center px-4 py-2 border border-neutral-600 rounded-md text-sm font-medium text-neutral-300 hover:bg-neutral-800 hover:text-white transition-colors duration-200">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        Déconnexion
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Top Header (Mobile mainly) -->
    <header class="bg-white shadow-sm h-16 flex items-center justify-between px-4 md:px-8 border-b border-neutral-200">
      <div class="flex items-center md:hidden">
        <span class="font-bold text-xl tracking-wider uppercase text-black">myTerrain</span>
      </div>
      <div class="flex items-center ml-auto space-x-4">
        <span class="text-sm font-medium text-neutral-600">Bienvenue, {{ adminName }}</span>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto bg-neutral-100">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

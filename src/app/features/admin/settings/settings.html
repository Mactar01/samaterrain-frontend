<div class="max-w-7xl mx-auto py-8">
  <div class="mb-8">
    <h1 class="text-3xl font-extrabold text-black tracking-tight">Paramètres Globaux</h1>
    <p class="mt-2 text-sm text-neutral-600">Configuration de myTerrain.</p>
  </div>

  <div class="bg-white border border-neutral-200 rounded-lg shadow-sm">
    <div class="p-6 border-b border-neutral-200">
      <h3 class="text-lg font-bold">Commission de la plateforme</h3>
      <p class="text-sm text-neutral-500 mt-1">Définissez le pourcentage prélevé sur chaque réservation.</p>
      
      <div class="mt-4 flex items-center">
        <input type="number" value="10" class="border border-neutral-300 rounded-md p-2 w-24 text-center focus:ring-black focus:border-black">
        <span class="ml-2 font-bold">%</span>
        <button class="ml-4 bg-black text-white px-4 py-2 rounded shadow hover:bg-neutral-800 text-sm">Enregistrer</button>
      </div>
    </div>
    
    <div class="p-6">
      <h3 class="text-lg font-bold text-red-600">Mode Maintenance</h3>
      <p class="text-sm text-neutral-500 mt-1">Activez ceci pour empêcher temporairement les réservations (pour mise à jour).</p>
      
      <div class="mt-4">
        <button class="bg-red-50 text-red-700 border border-red-200 px-4 py-2 rounded shadow-sm hover:bg-red-100 text-sm font-semibold">
          Activer le mode maintenance
        </button>
      </div>
    </div>
  </div>
</div>

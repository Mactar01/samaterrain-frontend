server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Support de l'historique de routage pour Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy pour les requêtes API vers le backend Laravel
    # On suppose que l'API est accessible sous /api
    location /api/ {
        proxy_pass http://backend:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy pour le stockage si nécessaire
    location /storage/ {
        proxy_pass http://backend:80/storage/;
        proxy_set_header Host $host;
    }
}
